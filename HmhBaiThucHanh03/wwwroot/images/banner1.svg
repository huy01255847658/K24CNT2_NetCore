<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 380" width="1140" height="380">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1140" height="380" fill="url(#bg1)"/>
  
  <!-- Decorative background circles -->
  <circle cx="100" cy="60" r="180" fill="#38bdf8" opacity="0.08" />
  <circle cx="1060" cy="320" r="220" fill="#6366f1" opacity="0.1" />

  <!-- Book Illustration on Left -->
  <g transform="translate(100, 70)" filter="url(#shadow)">
    <!-- Book spine & pages -->
    <path d="M 40,200 Q 110,180 180,200 L 180,60 Q 110,40 40,60 Z" fill="#f8fafc" opacity="0.95"/>
    <path d="M 180,200 Q 250,180 320,200 L 320,60 Q 250,40 180,60 Z" fill="#f1f5f9" opacity="0.95"/>
    <!-- Book cover/back -->
    <path d="M 35,206 Q 110,186 180,206 Q 250,186 325,206 L 330,62 Q 250,38 180,58 Q 110,38 30,62 Z" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <!-- Page lines left -->
    <line x1="60" y1="80" x2="160" y2="70" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="105" x2="160" y2="95" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="130" x2="160" y2="120" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="155" x2="140" y2="145" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Page lines right -->
    <line x1="200" y1="70" x2="300" y2="80" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="95" x2="300" y2="105" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="120" x2="300" y2="130" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="145" x2="280" y2="155" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ribbon Bookmark -->
    <path d="M 175,55 L 185,55 L 185,150 L 180,140 L 175,150 Z" fill="#ef4444"/>
    <!-- Sparkles -->
    <polygon points="180,10 183,25 198,28 183,31 180,46 177,31 162,28 177,25" fill="#fde047"/>
    <polygon points="60,25 62,35 72,37 62,39 60,49 58,39 48,37 58,35" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- Tag badge -->
  <rect x="520" y="65" width="220" height="38" rx="19" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="630" y="89" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">🔥 HỘI SÁCH MÙA THU</text>

  <!-- Main Headline -->
  <text x="520" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" filter="url(#shadow)">ĐẠI TIỆC SÁCH TRI THỨC</text>

  <!-- Promotion Subtitle -->
  <text x="520" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="bold" fill="url(#gold)">GIẢM ĐẾN 50% TẤT CẢ ĐẦU SÁCH HAY</text>

  <!-- Description -->
  <text x="520" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#cbd5e1">Khám phá hàng ngàn tựa sách văn học, truyện tranh, kỹ năng sống chọn lọc.</text>

  <!-- CTA Button Graphic -->
  <g transform="translate(520, 270)">
    <rect width="200" height="48" rx="24" fill="#38bdf8"/>
    <text x="100" y="30" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">MUA NGAY BÂY GIỜ →</text>
  </g>
</svg>
