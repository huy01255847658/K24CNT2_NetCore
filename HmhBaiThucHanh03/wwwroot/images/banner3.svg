<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 380" width="1140" height="380">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#facc15;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1140" height="380" fill="url(#bg3)"/>
  <circle cx="200" cy="80" r="170" fill="#34d399" opacity="0.1" />
  <circle cx="950" cy="300" r="200" fill="#a7f3d0" opacity="0.08" />

  <!-- Delivery / Gift Box and Book Illustration on Left -->
  <g transform="translate(130, 80)" filter="url(#shadow3)">
    <!-- Big Open Book -->
    <path d="M 20,200 Q 100,180 170,200 L 170,80 Q 100,60 20,80 Z" fill="#ecfdf5"/>
    <path d="M 170,200 Q 240,180 310,200 L 310,80 Q 240,60 170,80 Z" fill="#ffffff"/>
    <path d="M 15,206 Q 100,186 170,206 Q 240,186 315,206 L 318,82 Q 240,58 170,78 Q 100,58 12,82 Z" fill="none" stroke="#facc15" stroke-width="4.5"/>
    
    <!-- Stars / discount stamp -->
    <circle cx="170" cy="130" r="38" fill="#ef4444"/>
    <text x="170" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">FREESHIP</text>
    <text x="170" y="142" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fef08a">TOÀN QUỐC</text>
  </g>

  <!-- Tag badge -->
  <rect x="500" y="65" width="250" height="38" rx="19" fill="#facc15" filter="url(#shadow3)"/>
  <text x="625" y="89" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#064e3b">🚚 ƯU ĐÃI VẬN CHUYỂN</text>

  <!-- Main Headline -->
  <text x="500" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" filter="url(#shadow3)">SÁCH MỚI MỖI TUẦN</text>

  <!-- Promotion Subtitle -->
  <text x="500" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="url(#brightGold)">MIỄN PHÍ VẬN CHUYỂN ĐƠN TỪ 300K</text>

  <!-- Description -->
  <text x="500" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#d1fae5">Giao sách tận tay nhanh chóng, đóng gói cẩn thận từng ấn phẩm.</text>

  <!-- CTA Button Graphic -->
  <g transform="translate(500, 270)">
    <rect width="200" height="48" rx="24" fill="#ffffff"/>
    <text x="100" y="30" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#064e3b">ĐẶT SÁCH NGAY →</text>
  </g>
</svg>
